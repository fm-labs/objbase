[project]
name = "objbase"
version = "0.5.1"
description = "Damn simple object store for Python dicts and Pydantic models across multiple backends"
requires-python = ">=3.13"
dependencies = []
authors = [
  { name="fm-labs", email="code@fmlabs.dev" },
]
readme = "README.md"
keywords = ["storage", "key-value", "redis", "mongodb", "sqlite", "pydantic", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Database",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
redis = ["redis>=6.0"]
mongodb = ["pymongo>=4.13"]
pydantic = ["pydantic>=2.8"]
all = ["objbase[redis,mongodb,pydantic]"]

[project.urls]
Homepage = "https://github.com/fm-labs/objbase"
Issues = "https://github.com/fm-labs/objbase/issues"


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "mypy>=2.3.1",
    "pydantic>=2.12.5",
    "pymongo>=4.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "redis>=7.4.0",
    "ruff>=0.16.9",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

# `mypy` checks the library strictly. CI also checks tests and examples with:
#   mypy --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls tests examples
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
