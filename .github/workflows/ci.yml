name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run the full CI before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check --diff .
      - name: Mypy (library, strict)
        if: ${{ !cancelled() }}
        run: uv run mypy
      # Also check platform-specific branches (e.g. msvcrt file locking) as Windows would see them.
      - name: Mypy (library, strict, Windows)
        if: ${{ !cancelled() }}
        run: uv run mypy --platform win32
      # Tests and examples use the public API the way users do, so type checking
      # them catches annotations that are correct internally but awkward to use.
      - name: Mypy (tests and examples)
        if: ${{ !cancelled() }}
        run: uv run mypy --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls tests examples

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      # Redis and MongoDB tests use testcontainers; Docker is preinstalled on ubuntu runners.
      - name: Run tests
        run: uv run pytest -q

  test-other-os:
    name: Test (${{ matrix.os }}, no containers)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      # Covers platform-specific code such as file locking (fcntl vs msvcrt). These
      # runners can't run the Linux Redis/MongoDB containers, so those tests are excluded.
      - name: Run tests
        run: >-
          uv run pytest -q -k "not redis and not mongodb"
          --ignore=tests/test_redis_storage.py
          --ignore=tests/test_async_redis_storage.py
          --ignore=tests/test_mongodb_storage.py
          --ignore=tests/test_async_mongodb_storage.py

  test-minimum-deps:
    name: Test (minimum dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: Install package with lowest allowed extras
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[all]"
          uv pip install pytest pytest-asyncio testcontainers
          uv pip list | grep -iE "^(redis|pymongo|pydantic) "
      - name: Run tests
        run: .venv/bin/pytest -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Check wheel contents
        run: |
          unzip -l dist/*.whl | tee wheel-contents.txt
          grep -q "objbase/py.typed" wheel-contents.txt
          grep -q "licenses/LICENSE" wheel-contents.txt
